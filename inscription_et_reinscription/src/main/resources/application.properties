spring.application.name=inscription-et-reinscription
# Configuration MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/inscription_reinscription?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuration du serveur
server.port=8089

# =================================
# EUREKA DISCOVERY
# =================================
eureka.client.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# Configuration de l'encodage
spring.datasource.hikari.connection-test-query=SELECT 1

# Configuration des uploads
app.upload.dir=./uploads
app.upload.max-size=10485760
# Taille maximale : 10 MB (10 * 1024 * 1024)

# Configuration clients
clients.user-integration.url=http://localhost:8090

# OpenFeign timeouts (ms)
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=10000

# Désactiver la vérification de compatibilité Spring Cloud
spring.cloud.compatibility-verifier.enabled=false
