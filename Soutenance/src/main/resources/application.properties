# SERVER
server.port=8084

# APPLICATION
spring.application.name=soutenance

# DATABASE - MARIA DB
spring.datasource.url=jdbc:mariadb://localhost:3306/doctorat_soutenance
spring.datasource.username=root
spring.datasource.password=Meryem
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.format_sql=true
# JPA Naming Strategy - Convert camelCase to snake_case
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.hibernate.naming.implicit-strategy=org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy

# FILE UPLOAD
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# KAFKA (optionnel en d�veloppement)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=soutenance-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# =================================
# FEIGN CLIENTS
# =================================
spring.cloud.openfeign.client.config.default.connect-timeout=3000
spring.cloud.openfeign.client.config.default.read-timeout=5000
spring.cloud.openfeign.client.config.default.logger-level=basic
spring.cloud.openfeign.circuitbreaker.enabled=true

# URLs directes (optionnel - utilisé si Eureka n'est pas disponible)
# Laisser vide pour utiliser Eureka discovery
feign.client.inscription.url=
feign.client.documents.url=

# =================================
# EUREKA DISCOVERY
# =================================
eureka.client.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Retry configuration pour éviter les erreurs heartbeat
eureka.client.registry-fetch-interval-seconds=10
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# LOGGING
logging.level.org.springframework.web=INFO
logging.level.ma.emsi.soutenance=DEBUG
logging.level.org.hibernate.SQL=DEBUG

management.endpoints.web.exposure.include=info,health