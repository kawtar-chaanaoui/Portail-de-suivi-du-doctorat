spring.application.name=gateway-service
server.port=8888

# =================================
# EUREKA DISCOVERY
# =================================
eureka.client.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# =================================
# GATEWAY DISCOVERY
# =================================
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# =================================
# ROUTES CONFIGURATION
# =================================

# Route Gestion des comptes
spring.cloud.gateway.routes[0].id=gestion-comptes
spring.cloud.gateway.routes[0].uri=lb://gestion-comptes
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/comptes/**,/api/auth/**,/api/users/**

# Route Inscription et Réinscription
spring.cloud.gateway.routes[1].id=inscription-reinscription
spring.cloud.gateway.routes[1].uri=lb://inscription-et-reinscription
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/inscriptions/**,/api/reinscriptions/**,/api/doctorants/**

# Route Notification et Communication
spring.cloud.gateway.routes[2].id=notification-communication
spring.cloud.gateway.routes[2].uri=lb://notification-communication
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/notifications/**,/api/emails/**,/api/messages/**

# Route Soutenance (toutes les API)
spring.cloud.gateway.routes[3].id=soutenance
spring.cloud.gateway.routes[3].uri=lb://soutenance
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/soutenances/**

spring.cloud.gateway.routes[4].id=soutenance-documents
spring.cloud.gateway.routes[4].uri=lb://soutenance
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/documents/**

spring.cloud.gateway.routes[5].id=soutenance-jurys
spring.cloud.gateway.routes[5].uri=lb://soutenance
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/jurys/**

spring.cloud.gateway.routes[6].id=soutenance-prerequis
spring.cloud.gateway.routes[6].uri=lb://soutenance
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/prerequis/**

# =================================
# CORS CONFIGURATION
# =================================
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*

# =================================
# LOGGING
# =================================
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG
