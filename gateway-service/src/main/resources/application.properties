spring.application.name=gateway-service
server.port=8888
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Routes Configuration
spring.cloud.gateway.routes[0].id=gestion-comptes
spring.cloud.gateway.routes[0].uri=lb://gestion-comptes
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/comptes/**

spring.cloud.gateway.routes[1].id=inscription-reinscription
spring.cloud.gateway.routes[1].uri=lb://inscription-reinscription
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/inscriptions/**

spring.cloud.gateway.routes[2].id=notification-communication
spring.cloud.gateway.routes[2].uri=lb://notification-communication
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/notifications/**

spring.cloud.gateway.routes[3].id=soutenance
spring.cloud.gateway.routes[3].uri=lb://soutenance
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/soutenances/**
